<main class="container auth-wrap">

  <div class="row justify-content-center">

    <div class="col-md-5">

      <div class="card auth-card">

        <div class="card-body">

          <p class="eyebrow">Campus Connect</p>
          <h2 class="auth-title">Welcome back</h2>
          <p class="auth-subtitle">Choose your access category and continue.</p>

          <form (ngSubmit)="login()">

            <div class="mb-3">

              <label class="form-label">Login category</label>

              <select
                class="form-select"
                [(ngModel)]="role"
                name="role"
                required>
                <option value="student">Student</option>
                <option value="admin">Admin</option>
              </select>

            </div>

            <div class="mb-3">

              <label class="form-label">
                Email
              </label>

              <input
                type="email"
                class="form-control"
                [(ngModel)]="email"
                name="email"
                required>

            </div>

            <div class="mb-3">

              <label class="form-label">
                Password
              </label>

              <input
                type="password"
                class="form-control"
                [(ngModel)]="password"
                name="password"
                required>

            </div>

            <button
              class="btn btn-primary w-100 mt-2">
              Sign in securely
            </button>

          </form>

          <p class="auth-footer">
            New student?
            <a routerLink="/register">
              Register
            </a>
          </p>

        </div>

      </div>

    </div>

  </div>

</main>
