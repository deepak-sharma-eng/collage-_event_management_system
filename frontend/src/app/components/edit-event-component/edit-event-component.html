<main class="container page-shell">

  <div class="row justify-content-center">

    <div class="col-md-7 form-shell">

      <div class="card">

        <div class="card-body">

          <p class="eyebrow">Admin tools</p>
          <h2>Edit event</h2>
          <p class="text-secondary">Keep your event information accurate and up to date.</p>

          <hr>

          <form (ngSubmit)="updateEvent()">

            <div class="mb-3">

              <label class="form-label">
                Event Title
              </label>

              <input
                class="form-control"
                [(ngModel)]="event.title"
                name="title">

            </div>

            <div class="mb-3">

              <label class="form-label">
                Description
              </label>

              <textarea
                class="form-control"
                rows="4"
                [(ngModel)]="event.description"
                name="description">
              </textarea>

            </div>

            <div class="mb-3">

              <label class="form-label">
                Date
              </label>

              <input
                type="date"
                class="form-control"
                [(ngModel)]="event.date"
                name="date">

            </div>

            <div class="mb-3">

              <label class="form-label">
                Location
              </label>

              <input
                class="form-control"
                [(ngModel)]="event.location"
                name="location">

            </div>

            <div class="mb-3">

              <label class="form-label">
                Category
              </label>

              <input
                class="form-control"
                [(ngModel)]="event.category"
                name="category">

            </div>

            <div class="mb-3">

              <label class="form-label">
                Organizer
              </label>

              <input
                class="form-control"
                [(ngModel)]="event.organizer"
                name="organizer">

            </div>

            <button class="btn btn-primary">
              Update Event
            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

</main>
